<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care calendar</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1b2430">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Care">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2430; --muted:#5f6b7a; --line:#d5dbe3;
  --a:#8ad8f8; --a-ink:#084c6e; --b:#ffd391; --b-ink:#7a4100;
  --accent:#1b2430; --accent-ink:#ffffff; --warn:#b42318; --ok:#17663a;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --surface:#1a2029; --ink:#e9edf2; --muted:#9aa5b4; --line:#2d3643;
    --a:#1c6a90; --a-ink:#d3f0fd; --b:#94601c; --b-ink:#ffe6bf;
    --accent:#e9edf2; --accent-ink:#11151b; --warn:#ff9c8f; --ok:#7fd6a0;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#1a2029; --ink:#e9edf2; --muted:#9aa5b4; --line:#2d3643;
  --a:#1c6a90; --a-ink:#d3f0fd; --b:#94601c; --b-ink:#ffe6bf;
  --accent:#e9edf2; --accent-ink:#11151b; --warn:#ff9c8f; --ok:#7fd6a0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a-ink);outline-offset:2px}
.wrap{max-width:34rem;margin:0 auto;padding:1rem 1rem 6.5rem}
h1{font:700 1.7rem/1.1 var(--display);margin:.25rem 0 .6rem;letter-spacing:-.01em}
h2{font:600 1.15rem/1.2 var(--display);margin:1.5rem 0 .6rem}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.legend{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;padding:.2rem .65rem;border-radius:.35rem;font-weight:600;font-size:.9rem}
.chip.a,.pa{background:var(--a);color:var(--a-ink)}
.chip.b,.pb{background:var(--b);color:var(--b-ink)}
.ghost{background:none;border:1px solid var(--line);border-radius:.6rem;padding:.5rem .8rem;min-height:2.75rem;font-weight:500;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:1rem 0;background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:.25rem}
.tabs button{padding:0 .1rem;font-size:.92rem;border:0;background:none;border-radius:.6rem;min-height:2.75rem;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.count{display:inline-block;min-width:1.4rem;padding:0 .35rem;margin-left:.3rem;border-radius:1rem;background:var(--b);color:var(--b-ink);font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:1rem}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.monthbar strong{font:600 1.2rem var(--display)}
.monthbar button{width:2.75rem;height:2.75rem;border:1px solid var(--line);background:none;border-radius:.6rem;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:.3rem}
.dow{text-align:center;font-size:.8rem;color:var(--muted);font-weight:600;padding-bottom:.2rem}
.day{position:relative;border:0;background:none;height:2.9rem;padding:0;font-variant-numeric:tabular-nums;font-weight:500;font-size:1rem}
.day.a{background:var(--a);color:var(--a-ink);font-weight:600}
.day.b{background:var(--b);color:var(--b-ink);font-weight:600}
.day.l{border-top-left-radius:.5rem;border-bottom-left-radius:.9rem}
.day.r{border-top-right-radius:.9rem;border-bottom-right-radius:.5rem}
.day.today span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink);border-radius:.5rem}
.day.pend::after{content:"";position:absolute;inset:3px;border:2px dashed var(--ink);border-radius:.4rem;opacity:.55;pointer-events:none}
.day.hasnote::before{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.7}
.day i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor;opacity:.75}
.key{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.8rem;font-size:.82rem;color:var(--muted)}
.key span::before{content:"";display:inline-block;vertical-align:middle;margin-right:.35rem}
.key .k1::before{width:5px;height:5px;border-radius:50%;background:currentColor}
.key .k3::before{width:6px;height:6px;border-radius:2px;background:currentColor}
.key .k2::before{width:.9rem;height:.9rem;border:2px dashed currentColor;border-radius:.25rem}
.detail{margin-top:.8rem}
.detail p{margin:.15rem 0}
.detail .d{font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.up{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .8rem;background:var(--surface);border:1px solid var(--line);border-radius:.7rem}
.req{display:grid;gap:.5rem}
.req h3{margin:0;font:600 1.05rem var(--display)}
.req .runs{margin:0;padding:0;list-style:none;display:grid;gap:.3rem}
.req .runs li{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.note{margin:0;padding:.5rem .7rem;border-left:3px solid var(--line);background:var(--bg);border-radius:0 .5rem .5rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{border:0;border-radius:.7rem;min-height:2.9rem;padding:.6rem 1.1rem;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.pill{font-size:.8rem;font-weight:600;padding:.1rem .5rem;border-radius:1rem;border:1px solid currentColor}
.pill.approved{color:var(--ok)} .pill.declined{color:var(--warn)} .pill.withdrawn{color:var(--muted)}
.banner{margin:0 0 1rem;padding:.7rem .9rem;border:1px solid var(--line);border-left:4px solid var(--b-ink);background:var(--surface);border-radius:.6rem;font-size:.92rem}
.bar{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.bar .btn{display:block;width:100%;max-width:32rem;margin:0 auto;font-size:1.05rem}
dialog{border:1px solid var(--line);border-radius:1rem;background:var(--surface);color:var(--ink);width:min(32rem,calc(100vw - 1.5rem));max-height:calc(100% - 2rem);padding:1.1rem;overflow:auto}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog h2{margin-top:0}
label,legend{display:block;font-weight:600;margin:.9rem 0 .3rem;padding:0}
fieldset{border:0;margin:0;padding:0}
input[type=date],input[type=text],select,textarea{width:100%;min-height:2.9rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:.6rem;background:var(--bg)}
textarea{min-height:4.5rem;resize:vertical}
.types{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:2.9rem;padding:.4rem .5rem;border:1px solid var(--line);border-radius:.6rem;font-weight:500}
.opt input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt input:focus-visible+span{outline:3px solid var(--a-ink);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.preview{margin-top:1rem;padding:.7rem .8rem;border:1px dashed var(--line);border-radius:.6rem}
.err{color:var(--warn);font-weight:500;margin:.6rem 0 0}
.foot{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.1rem}
.exp .meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin:0}
.exp .amt{font:600 1.25rem var(--display);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.steps li{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.4rem}
.steps .done{color:var(--ok);font-weight:600}
.steps .todo{color:var(--muted)}
.sum{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.sum .amt{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
input[type=number]{width:100%;min-height:2.9rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:.6rem;background:var(--bg)}
.btn.small{min-height:2.4rem;padding:.35rem .8rem;font-size:.92rem}
.req p,.card>p{margin:0}
.card>p+p{margin-top:.3rem}
.card a:not(.btn){color:inherit;text-underline-offset:3px}
.agenda{list-style:none;margin:.6rem 0 0;padding:.6rem 0 0;border-top:1px solid var(--line);display:grid;gap:.45rem}
.agenda li{display:grid;grid-template-columns:4.2rem 1fr;gap:.6rem;align-items:baseline}
.agenda .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:.92rem}
.agenda .who{font-size:.88rem;color:var(--muted)}
.rt{width:100%;border-collapse:collapse;font-size:.92rem}
.rt th,.rt td{text-align:left;padding:.35rem .3rem;border-bottom:1px solid var(--line)}
.rt th{color:var(--muted);font-weight:600}
.rt td:first-child{width:2.4rem;padding-left:0}
.rt select{min-height:2.4rem;padding:.2rem .15rem;font-size:.85rem}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.days .opt span{min-height:2.5rem;padding:.2rem}
.checks{display:flex;flex-wrap:wrap;gap:.4rem}
.checks .opt span{padding:.4rem .9rem}
.setup{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.8rem 0 0;padding:.6rem .8rem;background:var(--surface);border:1px solid var(--line);border-radius:.7rem;font-size:.92rem}
.setup p{margin:0;flex:1 1 12rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Care calendar</h1>
      <div class="legend" id="legend"></div>
    </div>
    <button class="ghost" id="outBtn" type="button">Sign out</button>
  </div>

  <div class="setup" id="setup" hidden></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabCal" aria-selected="true" type="button">Calendar</button>
    <button role="tab" id="tabReq" aria-selected="false" type="button">Requests<span class="count" id="count" hidden></span></button>
    <button role="tab" id="tabExp" aria-selected="false" type="button">Expenses<span class="count" id="expCount" hidden></span></button>
    <button role="tab" id="tabKids" aria-selected="false" type="button">Kids</button>
  </div>

  <p class="banner" id="banner" hidden></p>

  <section id="calView">
    <div class="card">
      <div class="monthbar">
        <button type="button" id="prev" aria-label="Previous month">‹</button>
        <strong id="monthName"></strong>
        <button type="button" id="next" aria-label="Next month">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="key"><span class="k1">Holiday or special day</span><span class="k2">Change waiting for an answer</span><span class="k3">Handover note</span></div>
    </div>
    <div class="card detail" id="detail"></div>
    <h2>Coming weekends</h2>
    <ul class="list" id="upcoming"></ul>
    <h2>Holidays and special days</h2>
    <ul class="list" id="specials"></ul>
    <button class="btn sec" id="addSpecial" type="button" style="margin-top:.6rem">Add a special day</button>
    <h2>Your phone's calendar</h2>
    <div class="card" id="feed"></div>
  </section>

  <section id="reqView" hidden></section>
  <section id="expView" hidden></section>
  <section id="kidsView" hidden></section>
</div>

<div class="bar"><button class="btn" id="newBtn" type="button">New request</button></div>

<dialog id="formDlg"><form id="form" method="dialog"></form></dialog>
<dialog id="expDlg"><form id="expForm" method="dialog"></form></dialog>
<dialog id="kidsDlg"><form id="kidsForm" method="dialog"></form></dialog>
<dialog id="loginDlg"><form id="login" method="dialog">
  <h2>Care calendar</h2>
  <fieldset><legend>Who are you?</legend><div class="types" id="loginWho"></div></fieldset>
  <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required>
  <p class="err" id="loginErr" hidden></p>
  <div class="foot"><button class="btn" type="submit">Sign in</button></div>
</form></dialog>

<script src="/roster.js"></script>
<script>
(function(){
"use strict";
var R=ROSTER,DAY=R.DAY,HOL=R.HOL,SCHOOLS=R.SCHOOLS,num=R.num,key=R.key,dow=R.dow;
// S is the shared state the roster functions read; rebuilt by recompute().
var S={};
function owner(k){return R.owner(S,k)}
function night(k){return R.night(S,k)}
function resolve(w,k,m){return R.resolve(S,w,k,m)}
function atSchool(k){return R.atSchool(S,k)}
function actsOn(k){return R.actsOn(S,k)}
function dayName(k){return R.dayName(S,k)}
function recompute(){
  S={extras:extras,reqs:reqs,care:care,routine:routine,special:special,acts:acts,runs:runs};
  R.recompute(S);ov=S.ov;ovSet=S.ovSet;pend=S.pend;
}
var TYPES={swap:"Swap weekends",off:"Weekend off",holiday:"Holiday",change:"Change care days"};
var $=function(s){return document.querySelector(s)};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function fmt(k,year){var o={timeZone:"UTC",weekday:"short",day:"numeric",month:"short"};if(year)o.year="numeric";return new Date(num(k)*DAY).toLocaleDateString("en-NZ",o)}
function fmtRange(s,e){return s===e?fmt(s,true):fmt(s)+" – "+fmt(e,true)}
function todayKey(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function ok(v){return v==="a"||v==="b"}
function oth(p){return p==="a"?"b":"a"}

var who=null,names={a:"Parent A",b:"Parent B"},extras={},reqs=[],exps=[],acts=[],special={},care={},notes={},kidInfo={},runs={},ovSet={},routine={kids:[],school:{},nights:{}},ov={},pend={},loaded=false;
var today=todayKey(),sel=today,view={y:+today.slice(0,4),m:+today.slice(5,7)-1},tab="cal";

function nm(p){return names[p]||(p==="a"?"Parent A":"Parent B")}
function runs(ch){
  var ks=Object.keys(ch).sort(),out=[];
  ks.forEach(function(k){var last=out[out.length-1];if(last&&last.to===ch[k]&&num(k)===num(last.end)+1)last.end=k;else out.push({start:k,end:k,to:ch[k]})});
  return out;
}
function weekendsOf(p){
  var n=num(today),d=dow(n),fri=(d===5||d===6||d===0)?n-((d+2)%7):n+((5-d+7)%7),out=[];
  for(var i=0;i<30;i++){var f=fri+i*7;if(owner(key(f+1))===p)out.push(key(f))}
  return out;
}

/* ---------- API ---------- */
function api(path,body){
  return fetch("/api"+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,credentials:"same-origin"})
    .then(function(r){if(r.status===401){showLogin();throw new Error("auth")}return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Request failed");return j})});
}
function load(){
  return api("/state").then(function(s){$("#outBtn").hidden=false;who=s.who;names=s.names;extras=s.extras||{};reqs=s.requests||[];exps=s.expenses||[];acts=s.activities||[];special=s.special||{};care=s.care||{};notes=s.notes||{};kidInfo=s.kidInfo||{};runs=s.runs||{};routine=s.routine||routine;loaded=true;renderAll();resendPush()}).catch(function(){});
}

/* ---------- rendering ---------- */
function renderHeader(){
  var L=$("#legend");L.textContent="";
  ["a","b"].forEach(function(p){L.appendChild(el("span","chip "+p,nm(p)+(who===p?" (you)":"")))});
  var n=who?reqs.filter(function(r){return r.status==="pending"&&r.from!==who}).length:0;
  var c=$("#count");c.hidden=!n;c.textContent=n;
  $("#newBtn").disabled=!loaded;
}
function renderCal(){
  var first=Date.UTC(view.y,view.m,1)/DAY,len=new Date(Date.UTC(view.y,view.m+1,0)).getUTCDate(),lead=(dow(first)+6)%7;
  $("#monthName").textContent=new Date(first*DAY).toLocaleDateString("en-NZ",{timeZone:"UTC",month:"long",year:"numeric"});
  var g=$("#grid");g.textContent="";
  ["M","T","W","T","F","S","S"].forEach(function(d){g.appendChild(el("div","dow",d))});
  for(var i=0;i<lead;i++)g.appendChild(el("div"));
  for(var d=0;d<len;d++){(function(n){
    var k=key(n),o=owner(k),col=(dow(n)+6)%7,b=el("button","day");b.type="button";
    b.appendChild(el("span",null,String(d+1)));
    if(o){b.classList.add(o);
      if(col===0||d===0||owner(key(n-1))!==o)b.classList.add("l");
      if(col===6||d===len-1||owner(key(n+1))!==o)b.classList.add("r");}
    if(k===today)b.classList.add("today");
    if(k===sel)b.classList.add("sel");
    if(pend[k])b.classList.add("pend");
    if(notes[k]&&notes[k].length)b.classList.add("hasnote");
    if(dayName(k))b.appendChild(el("i"));
    b.setAttribute("aria-label",fmt(k,true)+(o?", with "+nm(o):"")+(dayName(k)?", "+dayName(k):"")+(pend[k]?", change waiting for an answer":""));
    b.onclick=function(){sel=k;renderCal();renderDetail()};
    g.appendChild(b);
  })(first+d)}
}
function renderDetail(){
  var D=$("#detail"),o=owner(sel);D.textContent="";
  D.appendChild(el("p","d",fmt(sel,true)+(sel===today?" (today)":"")));
  var p=el("p");
  if(o){p.appendChild(document.createTextNode("With "));p.appendChild(el("span","chip "+o,nm(o)));if(ovSet[sel])p.appendChild(el("span","muted small","  set by "+nm(ovSet[sel])));else if(ok(ov[sel]))p.appendChild(el("span","muted small","  changed by agreement"))}
  else p.textContent="Not on the weekend roster.";
  D.appendChild(p);
  if(dayName(sel))D.appendChild(el("p","muted",dayName(sel)+noSchoolText(sel)));
  if(schoolClosedText(sel))D.appendChild(el("p","muted",schoolClosedText(sel)));
  if(pend[sel])D.appendChild(el("p","muted","A change to this day is waiting for an answer."));
  var ag=agenda(sel);if(ag)D.appendChild(ag);
  D.appendChild(handover(sel));
  if(loaded&&sel>=today){
    var b=el("button","btn sec","Request a change for this day");b.type="button";b.style.marginTop=".6rem";
    b.onclick=function(){openForm({type:"change",from:sel,to:sel,withWho:(o===who)?"them":"me"})};
    D.appendChild(b);
  }
}
function renderUpcoming(){
  var U=$("#upcoming");U.textContent="";
  var n=num(today),d=dow(n),fri=(d===5||d===6||d===0)?n-((d+2)%7):n+((5-d+7)%7);
  for(var i=0;i<5;i++){
    var f=key(fri+i*7),o=owner(key(fri+i*7+1)),li=el("li","up");
    li.appendChild(el("span",null,fmtRange(f,key(fri+i*7+2))));
    li.appendChild(o?el("span","chip "+o,nm(o)):el("span","muted","Not set"));
    U.appendChild(li);
  }
}
function reqCard(r){
  var c=el("div","card req"),mine=r.from===who;
  var head=el("div","row");head.style.justifyContent="space-between";head.style.alignItems="center";
  head.appendChild(el("h3",null,TYPES[r.type]||"Request"));
  if(r.status!=="pending")head.appendChild(el("span","pill "+r.status,{approved:"Agreed",declined:"Declined",withdrawn:"Withdrawn"}[r.status]||r.status));
  c.appendChild(head);
  var sub=el("p","muted small","From "+nm(r.from)+(r.createdAt?", sent "+fmt(String(r.createdAt).slice(0,10)):""));sub.style.margin="0";c.appendChild(sub);
  var ul=el("ul","runs");
  runs(r.changes).forEach(function(x){var li=el("li");li.appendChild(el("span",null,fmtRange(x.start,x.end)+" with"));li.appendChild(el("span","chip "+x.to,nm(x.to)));ul.appendChild(li)});
  c.appendChild(ul);
  if(r.note)c.appendChild(el("p","note",r.note));
  if(r.reply)c.appendChild(el("p","note",nm(oth(r.from))+" replied: "+r.reply));
  if(r.status==="pending"){
    var row=el("div","row");
    if(mine){var wd=el("button","btn sec","Withdraw request");wd.type="button";wd.onclick=function(){setStatus(r,"withdrawn","",row)};row.appendChild(wd)}
    else{

function buildChanges(){

  if(f.type==="swap"){
    if(!f.mine||!f.theirs)return{err:"Choose both weekends."};
    for(i=0;i<3;i++){put(key(num(f.mine)+i),them);put(key(num(f.theirs)+i),me)}
  }else if(f.type==="off"){
    if(!f.mine)return{err:"Choose a weekend."};
    for(i=0;i<3;i++)put(key(num(f.mine)+i),them);
  }else{
    if(!f.from||!f.to)return{err:"Choose the first and last day."};
    var a=num(f.from),b=num(f.to);
    if(b<a)return{err:"The last day is before the first day."};
    if(b-a>62)return{err:"Keep a request to about two months or less."};
    for(n=a;n<=b;n++)put(key(n),f.withWho==="me"?me:them);
  }
  if(!Object.keys(ch).length)return{err:"Those days are already arranged that way."};
  return{ch:ch};
}

  table("By child (shared bills split evenly)",Object.keys(kid).sort().map(function(k){return [k,kid[k]]}));
  return c;
}

/* ---------- handover notes ---------- */
// Don't refresh under someone typing a note.
function typing(){var a=document.activeElement;return !!(a&&a.tagName==="INPUT"&&a.closest&&a.closest(".wrap")&&a.value)}
function handover(k){
  var w=el("div");w.style.marginTop=".7rem";w.style.paddingTop=".6rem";w.style.borderTop="1px solid var(--line)";
  var from=night(key(num(k)-1)),to=night(k);
  var h=el("p","d");h.style.margin="0 0 .3rem";
  if(from&&to&&from!==to){h.appendChild(document.createTextNode("Handover: "));h.appendChild(el("span","chip "+from,nm(from)));h.appendChild(document.createTextNode(" to "));h.appendChild(el("span","chip "+to,nm(to)))}
  else h.textContent="Notes";
  w.appendChild(h);
  (notes[k]||[]).forEach(function(n){
    var r=el("div","row");r.style.alignItems="flex-start";r.style.flexWrap="nowrap";r.style.margin=".35rem 0";
    var t=el("p","note",n.text);t.style.flex="1";r.appendChild(t);
    var meta=el("div","muted small",nm(n.by));meta.style.minWidth="4.5rem";
    if(n.by===who){var x=el("button","ghost","Remove");x.type="button";x.style.minHeight="2.2rem";x.style.padding=".2rem .5rem";x.style.marginTop=".2rem";
      x.onclick=function(){api("/notes/"+k+"/"+n.id+"/delete",{}).then(load)};meta.appendChild(el("br"));meta.appendChild(x)}
    r.appendChild(meta);w.appendChild(r);
  });
  if(loaded){
    var f=el("div","row");f.style.flexWrap="nowrap";f.style.marginTop=".3rem";
    var i=el("input");i.type="text";i.maxLength=400;i.placeholder="Add a note, like what's in their bags";i.setAttribute("aria-label","Handover note");i.style.flex="1";
    var b=el("button","btn small","Add");b.type="button";
    b.onclick=function(){var v=i.value.trim();if(!v)return;b.disabled=true;api("/notes",{date:k,text:v}).then(load).catch(function(e){b.disabled=false;if(e.message!=="auth")alertMsg("That didn't save: "+e.message)})};
    i.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();b.click()}};
    f.appendChild(i);f.appendChild(b);w.appendChild(f);
  }
  return w;
}

/* ---------- calendar feed ---------- */
var feedTok="";
function renderFeed(){
  var F=$("#feed");F.textContent="";
  if(!loaded)return;
  F.appendChild(el("p",null,"Subscribe once and your phone's calendar shows who has the kids, their activities, and the school runs you're doing. It updates by itself."));
  if(!feedTok){var lb=el("button","btn sec","Get my calendar link");lb.type="button";lb.style.marginTop=".6rem";lb.onclick=function(){api("/feed").then(function(r){feedTok=r.token;renderFeed()})};F.appendChild(lb);return}
  var https=location.origin+"/cal/"+feedTok+".ics",webcal=https.replace(/^https?:/,"webcal:");
  var row=el("div","row");row.style.marginTop=".6rem";
  var a=el("a","btn","Subscribe on this phone");a.href=webcal;a.style.textDecoration="none";a.style.display="inline-flex";a.style.alignItems="center";row.appendChild(a);
  var cp=el("button","btn sec","Copy link");cp.type="button";cp.onclick=function(){
    (navigator.clipboard?navigator.clipboard.writeText(https):Promise.reject()).then(function(){cp.textContent="Copied"},function(){prompt("Copy this link",https)});
  };row.appendChild(cp);F.appendChild(row);
  F.appendChild(el("p","muted small","For Google Calendar: copy the link, then on a computer open Google Calendar, Other calendars, +, From URL, and paste it."));
  var rs=el("button","ghost","Make a new link");rs.type="button";rs.style.marginTop=".4rem";
  rs.onclick=function(){if(confirm("Make a new link? The old one will stop working, so you'll need to subscribe again."))api("/feed/reset",{}).then(function(r){feedTok=r.token;renderFeed()})};
  F.appendChild(rs);
  var ps=F.querySelectorAll("p");Array.prototype.forEach.call(ps,function(p){p.style.margin=".4rem 0 0"});ps[0].style.margin="0";
}

/* ---------- install as an app, and notifications ---------- */
var swReg=null,installEvt=null,pushOn=false;
var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function b64ToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="===".slice((s.length+3)%4);var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function renderSetup(){
  var S=$("#setup");S.textContent="";
  if(!loaded){S.hidden=true;return}
  var canPush=swReg&&"PushManager" in window&&"Notification" in window;
  var p,b;
  if(isIOS&&!standalone){
    p=el("p",null,"To get notifications on your iPhone, tap the Share button, then Add to Home Screen, and open Care from there.");
    S.appendChild(p);
  }else if(canPush&&!pushOn&&Notification.permission!=="denied"){
    S.appendChild(el("p",null,"Get a notification when "+nm(oth(who))+" sends a request, adds a bill or changes the kids' plans."));
    b=el("button","btn small","Turn on");b.type="button";b.onclick=enablePush;S.appendChild(b);
  }else if(installEvt){
    S.appendChild(el("p",null,"Add Care to your home screen so it opens like an app."));
    b=el("button","btn small","Install");b.type="button";b.onclick=function(){installEvt.prompt();installEvt.userChoice.then(function(){installEvt=null;renderSetup()})};S.appendChild(b);
  }
  S.hidden=!S.firstChild;
}
// Re-send this device's subscription once signed in, so it belongs to whoever is using it now.
var resent=false;
function resendPush(){
  if(resent||!loaded||!swReg||!swReg.pushManager)return;resent=true;
  swReg.pushManager.getSubscription().then(function(sub){if(sub)api("/push/subscribe",{sub:sub.toJSON()}).catch(function(){})});
}
function enablePush(){
  Notification.requestPermission().then(function(perm){
    if(perm!=="granted"){alertMsg("Notifications are blocked. You can allow them in your browser's settings for this site.");return renderSetup()}
    return fetch("/api/push/key").then(function(r){return r.json()}).then(function(k){
      return swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(k.key)});
    }).then(function(sub){return api("/push/subscribe",{sub:sub.toJSON()})}).then(function(){pushOn=true;renderSetup()});
  }).catch(function(e){alertMsg("Couldn't turn on notifications: "+e.message)});
}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();installEvt=e;renderSetup()});
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").then(function(reg){
    swReg=reg;
    if(!reg.pushManager)return renderSetup();
    return reg.pushManager.getSubscription().then(function(sub){
      pushOn=!!sub;
      resendPush();renderSetup();
    });
  }).catch(function(){});
}
var startTab=(location.hash||"").slice(1);if(["req","exp","kids"].indexOf(startTab)>=0)setTab(startTab);
window.addEventListener("hashchange",function(){var t=location.hash.slice(1);if(["cal","req","exp","kids"].indexOf(t)>=0)setTab(t)});

/* ---------- login ---------- */
var pick="a";
function showLogin(){
  $("#outBtn").hidden=true;
  var w=$("#loginWho");w.textContent="";
  ["a","b"].forEach(function(p){var l=el("label","opt");l.style.margin="0";var i=el("input");i.type="radio";i.name="lwho";i.checked=pick===p;i.onchange=function(){pick=p};l.appendChild(i);l.appendChild(el("span","p"+p,nm(p)));w.appendChild(l)});
  $("#loginErr").hidden=true;
  if(!$("#loginDlg").open)$("#loginDlg").showModal();
}
$("#loginDlg").addEventListener("cancel",function(e){e.preventDefault()});
$("#login").addEventListener("submit",function(ev){
  ev.preventDefault();
  fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({who:pick,password:$("#pw").value}),credentials:"same-origin"})
    .then(function(r){if(!r.ok)throw new Error("Wrong password");$("#pw").value="";$("#loginDlg").close();return load()})
    .catch(function(e){var x=$("#loginErr");x.hidden=false;x.textContent=e.message});
});

renderAll();
fetch("/api/names").then(function(r){return r.json()}).then(function(n){if(!loaded){names=n;renderAll();if($("#loginDlg").open)showLogin()}}).catch(function(){});
load();
setInterval(function(){if(loaded&&!$("#formDlg").open&&!$("#expDlg").open&&!$("#kidsDlg").open&&!typing())load()},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&loaded)load()});
})();
